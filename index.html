<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Makes the website fit phones properly -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Duck Website 🦆</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Catch the duck! 🦆</h1>

    <p id="instructions">
        Catch it 10 times...
    </p>

    <!-- Duck -->
    <div id="duck">🦆</div>

    <!-- Cute message -->
    <div id="message"></div>

    <!-- Friend popup -->
    <div id="friendPopup">

        <div class="popupContent">

            <button id="closeButton">×</button>

            <img src="IMG_9434.jpg" alt="My stink">

            <h2>OH NO 😭💨</h2>

            <p>
                You made the duck fart!
            </p>

            <p class="smallText">
                ...and somehow your friend got blamed.
            </p>

        </div>

    </div>


    <script>

        const duck = document.getElementById("duck");
        const message = document.getElementById("message");

        const friendPopup =
            document.getElementById("friendPopup");

        const closeButton =
            document.getElementById("closeButton");

        let interactions = 0;
        let stopped = false;


        const messages = [
            "Quack! 💛",
            "You found me!",
            "Hehe, hi! 🥰",
            "Have a quacktastic day!",
            "You're egg-cellent! 🥚",
            "Happy duck noises! 🦆",
            "Quack quack! ✨",
            "You made me smile! 💕",
            "Squeeeak!",
            "Uh oh... 😳"
        ];


        // Move duck somewhere random
        function moveDuck() {

            if (stopped) return;

            const padding = 20;

            const duckSize = 70;

            const maxX =
                window.innerWidth - duckSize - padding;

            const maxY =
                window.innerHeight - duckSize - padding;

            const x =
                padding + Math.random() * Math.max(0, maxX);

            const y =
                padding + Math.random() * Math.max(0, maxY);

            duck.style.left = x + "px";
            duck.style.top = y + "px";
        }


        // Duck moves around automatically
        const moveTimer = setInterval(function () {

            if (!stopped) {
                moveDuck();
            }

        }, 2500);


        // Duck interaction
        function interactWithDuck() {

            if (stopped) return;

            interactions++;

            // Show cute message
            message.textContent =
                messages[interactions - 1];

            message.classList.add("show");


            // Move duck
            moveDuck();


            // Last interaction
            if (interactions >= 10) {

                stopped = true;

                clearInterval(moveTimer);

                // Change duck into farting duck
                duck.textContent = "🦆💨";

                duck.classList.add("finalDuck");

                message.textContent =
                    "PFFFFT! 💨";

                // Wait a moment, then show friend
                setTimeout(function () {

                    friendPopup.classList.add("show");

                }, 1000);
            }
        }


        /*
            DESKTOP:
            Hover over duck

            MOBILE:
            Tap duck
        */

        duck.addEventListener(
            "mouseenter",
            interactWithDuck
        );


        duck.addEventListener(
            "click",
            interactWithDuck
        );


        // Close friend popup
        closeButton.addEventListener(
            "click",
            function () {

                friendPopup.classList.remove("show");

            }
        );


        // Also close if they tap outside popup
        friendPopup.addEventListener(
            "click",
            function (event) {

                if (event.target === friendPopup) {

                    friendPopup.classList.remove("show");

                }

            }
        );


        // Initial duck position
        moveDuck();

    </script>

</body>

</html>

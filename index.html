<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Duck Website</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Welcome to my website! 🦆</h1>

    <!-- Duck -->
    <div id="duck">🦆</div>

    <!-- Message -->
    <div id="message"></div>

    <script>
        const duck = document.getElementById("duck");
        const message = document.getElementById("message");

        let hovers = 0;
        let stopped = false;

        const messages = [
            "Quack! 💛",
            "You found me!",
            "Hehe, hi! 🥰",
            "Have a quacktastic day!",
            "You're egg-cellent! 🥚",
            "Happy duck noises! 🦆",
            "Quack quack! ✨",
            "You made me smile! 💕",
            "Squeeeak!",
            "Okay... one more! 😳"
        ];

        // Move duck to a random position
        function moveDuck() {

            const maxX = window.innerWidth - 100;
            const maxY = window.innerHeight - 100;

            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            duck.style.left = x + "px";
            duck.style.top = y + "px";
        }

        // Move duck every 2 seconds
        const moveTimer = setInterval(function() {

            if (!stopped) {
                moveDuck();
            }

        }, 2000);


        // Hover over duck
        function duckHover() {

            if (stopped) {
                return;
            }

            hovers++;

            // Show message
            message.textContent = messages[hovers - 1];
            message.style.display = "block";

            // Move duck
            moveDuck();

            // 10th hover
            if (hovers >= 10) {

                stopped = true;

                clearInterval(moveTimer);

                message.textContent = "PFFFFT! 💨🦆";

                // Little fart animation
                duck.classList.add("fart");

            }
        }

        duck.addEventListener("mouseenter", duckHover);


        // Initial position
        moveDuck();

    </script>

</body>
</html>

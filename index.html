<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catch the Duck 🦆</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Catch the duck! 🦆</h1>

    <p id="instructions">
        Hover over the duck 10 times...
    </p>

    <!-- Duck -->
    <div id="duck">🦆</div>

    <!-- Cute message -->
    <div id="message"></div>


    <!-- =========================
         STINK POPUP
         ========================= -->

    <div id="stinkPopup">

        <div class="popupContent">

            <!-- Close button -->
            <button id="closeButton" aria-label="Close">
                ×
            </button>

            <!-- Your picture -->
            <img
                src="IMG_9434.JPG"
                alt="The source of the stink"
            >

            <h2>OH NO 😭💨</h2>

            <p>
                YOU MADE THE DUCK FART!
            </p>

            <p class="smallText">
                ...but somehow it smells like YOU. 💀
            </p>

        </div>

    </div>


    <script>

        // =========================
        // GET ELEMENTS
        // =========================

        const duck =
            document.getElementById("duck");

        const message =
            document.getElementById("message");

        const stinkPopup =
            document.getElementById("stinkPopup");

        const closeButton =
            document.getElementById("closeButton");


        // =========================
        // VARIABLES
        // =========================

        let interactions = 0;

        let stopped = false;


        // =========================
        // CUTE MESSAGES
        // =========================

        const messages = [

            "Quack! 💛",

            "You found me! 👀",

            "Hehe, hi! 🥰",

            "Have a quacktastic day! ✨",

            "You're egg-cellent! 🥚",

            "Happy duck noises! 🦆",

            "Quack quack! 💕",

            "You made me smile! 😊",

            "Squeeeak! 🥹"

        ];


        // =========================
        // MOVE DUCK
        // =========================

        function moveDuck() {

            if (stopped) {
                return;
            }


            const duckSize = 90;

            const padding = 20;


            const maxX =
                window.innerWidth
                - duckSize
                - padding;


            const maxY =
                window.innerHeight
                - duckSize
                - padding;


            const x =
                padding +
                Math.random()
                * Math.max(0, maxX);


            const y =
                padding +
                Math.random()
                * Math.max(0, maxY);


            duck.style.left =
                x + "px";

            duck.style.top =
                y + "px";
        }


        // =========================
        // SHOW MESSAGE
        // =========================

        function showMessage(text) {

            message.textContent = text;

            message.classList.add("show");


            // Hide after 1.5 seconds

            setTimeout(function () {

                message.classList.remove("show");

            }, 1500);
        }


        // =========================
        // AUTOMATIC DUCK MOVEMENT
        // =========================

        const moveTimer =
            setInterval(function () {

                if (!stopped) {

                    moveDuck();

                }

            }, 2500);


        // =========================
        // DUCK INTERACTION
        // =========================

        function interactWithDuck() {

            // Don't allow anything
            // after the final interaction

            if (stopped) {
                return;
            }


            interactions++;


            // =========================
            // INTERACTIONS 1–9
            // =========================

            if (interactions < 10) {

                showMessage(
                    messages[interactions - 1]
                );

                moveDuck();

                return;
            }


            // =========================
            // INTERACTION #10
            // =========================

            stopped = true;

            clearInterval(moveTimer);


            // Change duck into
            // farting duck

            duck.textContent = "🦆💨";

            duck.classList.add("finalDuck");


            // Final message

            showMessage(
                "PFFFFT! 💨"
            );


            // Show stink popup
            // after a short delay

            setTimeout(function () {

                stinkPopup.classList.add("show");

            }, 1000);
        }


        // =========================
        // DESKTOP
        // =========================

        duck.addEventListener(
            "mouseenter",
            interactWithDuck
        );


        // =========================
        // MOBILE
        // =========================

        duck.addEventListener(
            "click",
            interactWithDuck
        );


        // =========================
        // CLOSE POPUP
        // =========================

        closeButton.addEventListener(
            "click",
            function () {

                stinkPopup.classList.remove(
                    "show"
                );

            }
        );


        // =========================
        // CLICK OUTSIDE POPUP
        // =========================

        stinkPopup.addEventListener(
            "click",
            function (event) {

                if (
                    event.target === stinkPopup
                ) {

                    stinkPopup.classList.remove(
                        "show"
                    );

                }

            }
        );


        // =========================
        // START DUCK
        // =========================

        moveDuck();

    </script>

</body>

</html>
